<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: required for env(safe-area-inset-*) to report anything but
         0 on iOS. The shell pads with .safe-top / .safe-bottom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f1e8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121714" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: the page paints edge-to-edge under the status bar, which is
         what keeps the cream ground continuous. Status-bar glyphs follow the SYSTEM
         appearance — which is also why the app's default theme is 'system'. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SwingCheck" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SwingCheck</title>
    <script>
      // Set theme/accent before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var s = (JSON.parse(localStorage.getItem('swingcheck-settings') || '{}').state) || {};
          var theme = s.theme || 'system';
          var resolved = theme === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : theme;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.accent = s.accent || 'emerald';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.accent = 'emerald';
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
