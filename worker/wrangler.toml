name = "swingcheck-api"
main = "worker.ts"
compatibility_date = "2024-01-01"

# Persistent storage for client logs. Fill in database_id after running:
#   npx wrangler d1 create swingcheck-logs
[[d1_databases]]
binding = "DB"
database_name = "swingcheck-logs"
database_id = "REPLACE_WITH_DATABASE_ID"
migrations_dir = "migrations"
